@if (isVisible()) {
  <!-- כפתור פתיחה / סגירה -->
  <button class="chat-fab" (click)="toggle()" [attr.aria-label]="isOpen() ? 'סגור צ\'אט' : 'פתח צ\'אט עזרה'">
    @if (isOpen()) {
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    } @else {
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    }
  </button>

  <!-- חלון הצ'אט -->
  @if (isOpen()) {
    <div class="chat-window" role="dialog" aria-label="עוזר וירטואלי">
      <!-- כותרת -->
      <div class="chat-header">
        <div class="chat-header-info">
          <div class="chat-avatar">✦</div>
          <div>
            <div class="chat-title">עוזר SmartClinic</div>
            <div class="chat-subtitle">זמין לעזור</div>
          </div>
        </div>
        <button class="chat-close-btn" (click)="toggle()" aria-label="סגור">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- הודעות -->
      <div class="chat-messages" #messagesEl>
        @for (msg of messages(); track $index) {
          <div class="msg" [class.msg-user]="msg.role === 'user'" [class.msg-bot]="msg.role === 'assistant'">
            <div class="msg-bubble">{{ msg.content }}</div>
          </div>
        }
        @if (loading()) {
          <div class="msg msg-bot">
            <div class="msg-bubble typing">
              <span></span><span></span><span></span>
            </div>
          </div>
        }
      </div>

      <!-- שורת קלט -->
      <div class="chat-input-area">
        <textarea
          class="chat-input"
          [(ngModel)]="userInput"
          (keydown)="onKeydown($event)"
          placeholder="כתוב הודעה..."
          rows="1"
          [disabled]="loading()"
          aria-label="הודעה לצ'אטבוט"
        ></textarea>
        <button
          class="chat-send-btn"
          (click)="send()"
          [disabled]="!userInput.trim() || loading()"
          aria-label="שלח"
        >
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/>
            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  }
}
