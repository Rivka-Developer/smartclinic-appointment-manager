services:
  - type: web
    name: smartclinic-api
    runtime: docker
    plan: free
    rootDir: AppointmentManager
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AllowedOrigins__0
        value: https://smartclinic-app.onrender.com
      - key: Jwt__Key
        sync: false
      - key: ConnectionStrings__DefaultConnection
        sync: false
      - key: Authentication__Google__ClientId
        sync: false
      - key: GeminiSettings__ApiKey
        sync: false
      - key: Email__SmtpUser
        sync: false
      - key: Email__SmtpPassword
        sync: false

  - type: web
    name: smartclinic-app
    runtime: static
    rootDir: AppointmentManagerClient/appointment-manager
    buildCommand: npm ci && npm run build -- --configuration production
    staticPublishPath: dist/appointment-manager/browser
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
